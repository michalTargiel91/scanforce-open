name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: ESLint (LWC), Apex grammar, complexity, metadata guardrails and documentation links
        run: npm run lint
      - name: Prettier (Apex, LWC JS/HTML/CSS)
        run: npm run format:check
      - name: Jest (Lightning Web Components) with coverage thresholds
        run: npm run test:unit:coverage
      - name: Python suites (mock provider, conformance checker, scripts)
        run: npm run test:python
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/validate-scratch.sh
          bash -n scripts/validate-preview.sh

  salesforce-static:
    name: Salesforce source conversion and security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.151.7
          sf plugins install @salesforce/plugin-code-analyzer@5.16.0
      - name: Convert source (metadata structure)
        run: |
          sf project convert source --root-dir force-app --output-dir "$RUNNER_TEMP/scanforce-open-metadata"
          sf project convert source --root-dir provider-config --output-dir "$RUNNER_TEMP/provider-config-metadata"
          for example in field-mappings flows record-page; do
            sf project convert source --root-dir "examples/$example" --output-dir "$RUNNER_TEMP/example-$example"
          done
      - name: PMD security rules (no org required)
        run: sf code-analyzer run --workspace . --target force-app --rule-selector pmd:Security --severity-threshold 3

  reference-provider:
    name: Reference provider container conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the reference provider container
        run: |
          docker build -t scanforce-open-reference-provider examples/mock-provider
          echo "PROVIDER_TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Run the conformance checker as a provider's CI would
        run: |
          docker run -d --rm --name reference-provider -p 127.0.0.1:8787:8787 \
            -e MOCK_PROVIDER_TOKEN="$PROVIDER_TOKEN" scanforce-open-reference-provider
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          for type in invoice review; do
            python3 tools/provider-conformance/check_provider.py \
              --base-url http://127.0.0.1:8787/connect --allow-insecure-http --document-type "$type" --deadline 30
          done

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan working tree and Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit (gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Development toolchain audit (report only)
        run: npm audit --audit-level=high || echo "::warning::Development-only dependency advisories found; nothing from npm is deployed to Salesforce."
