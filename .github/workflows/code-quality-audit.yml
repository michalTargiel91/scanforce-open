name: Code Analyzer deep audit
# Broader than the required pull-request gate (ci.yml): every PMD Apex rule, the
# AppExchange advisory rules, Flow Scanner, duplication and the Salesforce Graph
# Engine. Only PMD Apex severity 1-2 findings fail this run; everything else is
# reported as workflow annotations and downloadable reports. ApexGuru needs an org
# and is run by hand (docs/testing.md).
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  # Only a change to the audit itself triggers it on a pull request (a workflow that is not
  # on the default branch yet cannot be dispatched by hand, and the audit's own changes
  # should be exercised on a runner before they merge). It is not a required check.
  pull_request:
    paths:
      - scripts/code-analyzer.sh
      - code-analyzer.yml
      - .github/workflows/code-quality-audit.yml
permissions:
  contents: read

jobs:
  audit:
    name: Deep audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.151.7
          sf plugins install @salesforce/plugin-code-analyzer@5.16.0
      - name: Run the deep audit
        run: bash scripts/code-analyzer.sh audit "$RUNNER_TEMP/code-analyzer-reports"
      - name: Upload JSON, SARIF and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-analyzer-reports
          path: ${{ runner.temp }}/code-analyzer-reports
          if-no-files-found: ignore
          retention-days: 30
